<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FreeGameStore" />
  <meta name="application-name" content="FreeGameStore" />
  <title>Sign out — FreeGameStore</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>(function(){try{var p=localStorage.getItem('stores-theme');var d=p==='dark'||(!p||p==='system')&&matchMedia('(prefers-color-scheme: dark)').matches;if(d)document.documentElement.dataset.theme='dark';var t=localStorage.getItem('stores-text-size');if(t)document.documentElement.dataset.text=t;}catch(e){}})()</script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header></header>

  <main class="container">
    <div class="page-header">
      <h1>Sign out of FreeGameStore?</h1>
      <p id="signout-status">This signs you out of every game on FreeGameStore.</p>
    </div>
    <div class="page-content">
      <p>
        <button id="signout-confirm" class="btn-primary" type="button">Sign out</button>
        <a id="signout-cancel" href="/">Cancel</a>
      </p>
    </div>
  </main>

  <footer></footer>
  <script src="/theme.js" defer></script>
  <script src="/signout.js" defer></script>
</body>
</html>
