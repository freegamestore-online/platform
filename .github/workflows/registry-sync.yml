name: Weekly registry sync

# Refresh each game's lastUpdated in registry.json from its GitHub repo's last
# push time, and commit the result straight to main — no PR (#417). The push to
# sites/freegamestore/registry.json triggers deploy-storefront.yml.

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC (ahead of the 06:00 weekly audit)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Refresh lastUpdated from GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: node sites/freegamestore/scripts/sync-registry.mjs

      # Commit directly to main via the GitHub contents API, reusing the
      # auditor's hardened publisher (SHA fetch, 404 handling, no argv limit).
      - name: Publish registry.json to main
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          FGS_DATA_PATH: sites/freegamestore/registry.json
        run: |
          set -euo pipefail
          if git diff --quiet -- sites/freegamestore/registry.json; then
            echo "No registry changes to publish."
            exit 0
          fi
          FGS_COMMIT_MESSAGE="data: weekly registry lastUpdated sync $(date -u +%F)" \
            bash jobs/auditor/publish-quality-results.sh sites/freegamestore/registry.json
