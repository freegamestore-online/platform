name: Deploy admin

on:
  push:
    branches: [main]
    paths:
      - apps/admin/**
      - contracts/error-log/**
      - contracts/game-metadata/**
      - contracts/registry-ownership/**
      - contracts/cross-site/**
      - contracts/canary-session/**
      - contracts/github-oidc/**
      - contracts/handoff-delivery/**
      - contracts/session-jwt/**
      - .github/workflows/deploy-admin.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-admin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` here on purpose — same fix as e759e8a on packages-ci.yml.
      # The root package.json declares packageManager "pnpm@10.30.3", and
      # pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 hard-errors on "Multiple versions of pnpm specified"
      # when a pin is also given, failing the job before it installs anything.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Install from root so pnpm resolves the workspace correctly.
      # apps/admin is now a pnpm workspace member with deps in root pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter admin test
      # apps/admin/web is not a workspace member; install from its own lockfile
      # (--ignore-workspace, same as workers/auth) instead of an unpinned npm install.
      - run: pnpm --dir apps/admin/web install --frozen-lockfile --ignore-workspace
      - run: pnpm --dir apps/admin/web build
      # wrangler is an exact devDependency of apps/admin (#468), never npx-fetched.
      - run: pnpm --filter admin exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
