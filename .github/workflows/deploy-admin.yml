name: Deploy admin

on:
  push:
    branches: [main]
    paths:
      - apps/admin/**
      - contracts/error-log/**
      - .github/workflows/deploy-admin.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-admin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — same fix as e759e8a on packages-ci.yml.
      # The root package.json declares packageManager "pnpm@10.30.3", and
      # pnpm/action-setup@v4 hard-errors on "Multiple versions of pnpm specified"
      # when a pin is also given, failing the job before it installs anything.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Install from root so pnpm resolves the workspace correctly.
      # apps/admin is now a pnpm workspace member with deps in root pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter admin test
      # apps/admin/web has no workspace file, so pin this install.
      - run: npm install --prefix apps/admin/web
      - run: npm run --prefix apps/admin/web build
      - run: cd apps/admin && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
