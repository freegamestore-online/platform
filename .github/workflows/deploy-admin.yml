name: Deploy admin

on:
  push:
    branches: [main]
    paths:
      - apps/admin/**
      - contracts/error-log/**
      - .github/workflows/deploy-admin.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-admin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — same fix as e759e8a on packages-ci.yml.
      # The root package.json declares packageManager "pnpm@10.30.3", and
      # pnpm/action-setup@v4 hard-errors on "Multiple versions of pnpm specified"
      # when a pin is also given, failing the job before it installs anything.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/admin/pnpm-lock.yaml
      # --ignore-workspace, same fix as 9c82339 on packages-ci.yml: pnpm walks UP
      # to the root pnpm-workspace.yaml (which covers packages/* only), resolves
      # THAT workspace and silently skips apps/admin's own node_modules —
      # exiting 0 while leaving the test runner missing. Pin the install to this unit.
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm test
      # apps/admin/web has no workspace file either, so pin this install too.
      - run: pnpm --dir web install --frozen-lockfile --ignore-workspace
      - run: pnpm --dir web exec vite build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
