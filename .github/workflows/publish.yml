name: Publish to npm

# Triggers on push to main that touches publishable packages.
# Each package self-checks: if its version matches what's on npm,
# publish is a no-op. Release flow:
#
#   1. cd packages/games-sdk (or fgs-cli)
#   2. npm version patch
#   3. git push --follow-tags
#
# Auth: OIDC trusted publishing — no stored NPM_TOKEN needed.
# Each @freegamestore/* package is linked to this repo on npmjs.com.

on:
  push:
    branches: [main]
    paths:
      - 'packages/games-sdk/**'
      - 'packages/fgs-cli/**'
      - 'packages/compliance/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [games-sdk, fgs-cli, compliance]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      # Gate publishing on the package's own checks (#97). ci.yml runs in
      # parallel but is not a dependency of this workflow, so without these a
      # version bump that broke tests was published to npm anyway (the agent
      # consumes @freegamestore/compliance from npm).
      - name: Typecheck
        working-directory: packages/${{ matrix.package }}
        run: pnpm typecheck

      - name: Test
        working-directory: packages/${{ matrix.package }}
        run: pnpm test

      - name: Decide whether to publish
        id: decide
        working-directory: packages/${{ matrix.package }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          LOCAL_VER=$(node -p "require('./package.json').version")
          NPM_VER=$(npm view "$PKG_NAME" version 2>/dev/null || echo "0.0.0")
          echo "$PKG_NAME — local=$LOCAL_VER  npm=$NPM_VER"
          if [ "$LOCAL_VER" = "$NPM_VER" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged — skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Version bumped ($NPM_VER → $LOCAL_VER) — will publish."
          fi

      - name: Pack with workspace protocol rewrite
        if: steps.decide.outputs.publish == 'true'
        working-directory: packages/${{ matrix.package }}
        run: pnpm pack --out package.tgz

      - name: Publish via OIDC trusted publishing
        if: steps.decide.outputs.publish == 'true'
        working-directory: packages/${{ matrix.package }}
        # Use npm publish (not pnpm publish) on the tarball to ensure OIDC token
        # exchange works. pnpm publish under 10.30.3 may not perform the exchange,
        # causing E404 on PUT. pnpm pack already rewrites workspace:* to real
        # semver, so npm publish on the tarball works correctly.
        run: npm publish package.tgz --access public --provenance --loglevel verbose
