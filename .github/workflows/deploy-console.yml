name: Deploy console

on:
  push:
    branches: [main]
    paths:
      - apps/console/**
      - contracts/error-log/**
      - contracts/registry-ownership/**
      - contracts/cross-site/**
      - contracts/canary-session/**
      - contracts/handoff-delivery/**
      - contracts/session-jwt/**
      - .github/workflows/deploy-console.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-console
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` here on purpose — same fix as e759e8a on packages-ci.yml.
      # The root package.json declares packageManager "pnpm@10.30.3", and
      # pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 hard-errors on "Multiple versions of pnpm specified"
      # when a pin is also given, failing the job before it installs anything.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/console/pnpm-lock.yaml
      # NO --ignore-workspace here, unlike the other deploy workflows:
      # apps/console has its own pnpm-workspace.yaml (console + web) that must
      # stay intact so the web build resolves. See 9c82339 / issue #33.
      - run: pnpm install --frozen-lockfile
      # Gate the deploy on the console's own checks (#97). The console has real
      # users; until this, a commit that broke its tests shipped to them anyway.
      - name: Typecheck
        run: pnpm typecheck
      - name: Test (web + functions)
        run: pnpm test
      - name: Build
        run: cd web && pnpm build
      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy web/dist --project-name=freegamestore-publisher
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
