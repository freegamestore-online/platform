name: Deploy auth

on:
  push:
    branches: [main]
    paths:
      - workers/auth/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - contracts/session-jwt/**
      - contracts/canary-session/**
      - contracts/github-oidc/**
      - contracts/handoff-delivery/**
      - .github/workflows/deploy-auth.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-auth
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` here on purpose — same fix as e759e8a on packages-ci.yml.
      # The root package.json declares packageManager "pnpm@10.30.3", and
      # pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 hard-errors on "Multiple versions of pnpm specified"
      # when a pin is also given, failing the job before it installs anything.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Install from the repo root, as deploy-mcp.yml does: workers/auth is a
      # member of the root pnpm workspace, so this is the lockfile packages-ci.yml
      # tests against, and --frozen-lockfile ships exactly that tree (#495).
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter freegamestore-auth test
      - run: npx wrangler deploy
        working-directory: workers/auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
