name: Deploy host

on:
  push:
    branches: [main]
    paths:
      - workers/host/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/deploy-host.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-host
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # No `version:` here on purpose — same fix as e759e8a on packages-ci.yml.
      # The root package.json declares packageManager "pnpm@10.30.3", and
      # pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 hard-errors on "Multiple versions of pnpm specified"
      # when a pin is also given, failing the job before it installs anything.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Host is a root workspace member; use its authoritative lockfile,
      # including the Workers-runtime SEO regression dependencies.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter host lint
      - run: pnpm --filter host typecheck
      - run: pnpm --filter host test
      # Apply pending D1 migrations before the new code ships (the loader reads
      # game_analytics, #350). Migrations are idempotent (IF NOT EXISTS) and
      # wrangler records applied ones, so re-runs are no-ops.
      - run: npx wrangler d1 migrations apply freegamestore --remote
        working-directory: workers/host
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        working-directory: workers/host
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
