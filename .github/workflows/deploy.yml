name: Deploy host worker

# Ships the freegamestore-host Worker (Path B: serves games from R2 by route
# lookup) via GitHub Actions. This standalone repo had no CI — fixes shipped
# only via local `wrangler deploy`. Requires repo secrets CLOUDFLARE_API_TOKEN
# + CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No typecheck/test gate: this repo has no tsconfig.json (the `typecheck`
      # script is a no-op that errors), so wrangler's esbuild bundle is the gate.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
