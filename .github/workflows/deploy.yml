name: Deploy auth worker

# Ships the freegamestore-auth Worker via GitHub Actions. This standalone repo
# had no CI — fixes shipped only via local `wrangler deploy`. The unit tests now
# gate the deploy (no typecheck script in this repo). Requires repo secrets
# CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gate the deploy on the unit tests.
      - run: pnpm test
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
