name: Deploy host worker

# Ships the freegamestore-host Worker (Path B: serves games from R2 by route
# lookup) via GitHub Actions. This standalone repo had no CI — fixes shipped
# only via local `wrangler deploy`. Requires repo secrets CLOUDFLARE_API_TOKEN
# + CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gate the deploy: a real typecheck (tsconfig.json now present) + the unit
      # tests must pass before shipping. Previously host source was never
      # type-checked and nothing but wrangler's esbuild bundle ran.
      - run: pnpm typecheck
      - run: pnpm test
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
