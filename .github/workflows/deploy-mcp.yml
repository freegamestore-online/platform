name: Deploy MCP

on:
  push:
    branches: [main]
    paths:
      - workers/mcp/**
      - contracts/registry-ownership/**
      - contracts/handoff-delivery/**
      - contracts/canary-session/**
      - .github/workflows/deploy-mcp.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mcp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Install from the repo root: workers/mcp depends on the workspace package
      # @freegamestore/contracts (workspace:*), which only resolves inside the
      # root pnpm workspace. Same path as packages-ci.yml's test-mcp job (#147).
      # --frozen-lockfile deploys exactly the tree the lockfile tested (#97).
      - run: pnpm install --frozen-lockfile
      # contracts exposes dist/ as its entry point, so it must be built first.
      - run: pnpm --filter @freegamestore/contracts build
      - run: pnpm --filter freegamestore-mcp typecheck
      - run: pnpm --filter freegamestore-mcp test
      - run: npx wrangler deploy
        working-directory: workers/mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
