name: Deploy MCP

on:
  push:
    branches: [main]
    paths:
      - workers/mcp/**
      - contracts/registry-ownership/**
      - .github/workflows/deploy-mcp.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mcp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Install from the repo root: workers/mcp depends on the workspace package
      # @freegamestore/contracts (workspace:*), which only resolves inside the
      # root pnpm workspace. Same path as packages-ci.yml's test-mcp job (#147).
      # --frozen-lockfile deploys exactly the tree the lockfile tested (#97).
      - run: pnpm install --frozen-lockfile
      # contracts exposes dist/ as its entry point, so it must be built first.
      - run: pnpm --filter @freegamestore/contracts build
      - run: pnpm --filter freegamestore-mcp typecheck
      - run: pnpm --filter freegamestore-mcp test
      - run: npx wrangler deploy
        working-directory: workers/mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
