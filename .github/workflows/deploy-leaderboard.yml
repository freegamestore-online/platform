name: Deploy leaderboard

on:
  push:
    branches: [main]
    paths:
      - workers/leaderboard/**
      - .github/workflows/deploy-leaderboard.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-leaderboard
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/leaderboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # No `version:` here on purpose — same fix as e759e8a on packages-ci.yml.
      # The root package.json declares packageManager "pnpm@10.30.3", and
      # pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 hard-errors on "Multiple versions of pnpm specified"
      # when a pin is also given, failing the job before it installs anything.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workers/leaderboard/pnpm-lock.yaml
      # --ignore-workspace, same fix as 9c82339 on packages-ci.yml: pnpm walks UP
      # to the root pnpm-workspace.yaml (which covers packages/* only), resolves
      # THAT workspace and silently skips workers/leaderboard's own node_modules —
      # exiting 0 while leaving wrangler missing. Pin the install to this unit.
      - run: pnpm install --frozen-lockfile --ignore-workspace
      # Gate the deploy on the worker's own checks (#97).
      - run: pnpm typecheck
      - run: pnpm test
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
