name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  vcqa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run vcqa
        id: vcqa
        continue-on-error: true
        run: npx @vibecodeqa/cli@0.57.0 --ci --badge --sarif --skip-tests .

      - name: Upload SARIF
        if: always() && hashFiles('.vibe-check/report.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: .vibe-check/report.sarif

      - name: Upload badge
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-badge
          path: .vibe-check/badge.svg
          if-no-files-found: ignore

      - name: PR comment with score
        if: always() && github.event_name == 'pull_request' && hashFiles('.vibe-check/report.json') != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('.vibe-check/report.json', 'utf8'));
            const grade = report.grade;
            const score = report.score;
            const issues = report.totalIssues;
            const checks = report.checks
              .filter(c => c.score !== null && c.score !== undefined)
              .map(c => `| ${c.name} | ${c.score}/100 | ${(c.issues||[]).length} |`)
              .join('\n');

            const body = `## vcqa ${grade} ${score}/100

            | Check | Score | Issues |
            |-------|-------|--------|
            ${checks}

            **${issues} total issues**`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## vcqa'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Check quality gate
        if: always()
        run: |
          if [ -f .vibe-check/report.json ]; then
            SCORE=$(python3 -c "import json; print(json.load(open('.vibe-check/report.json'))['score'])")
            echo "Quality score: $SCORE/100"
            if [ "$SCORE" -lt 40 ]; then
              echo "::error::Quality score $SCORE is below minimum threshold (40)"
              exit 1
            fi
          fi
