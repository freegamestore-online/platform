name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  vcqa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run vcqa
        id: vcqa
        continue-on-error: true
        run: npx @vibecodeqa/cli@0.57.0 --ci --badge --sarif --skip-tests .

      - name: Upload SARIF
        if: always() && hashFiles('.vibe-check/report.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: .vibe-check/report.sarif

      - name: Upload badge
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-badge
          path: .vibe-check/badge.svg
          if-no-files-found: ignore

      - name: PR comment with score
        if: always() && github.event_name == 'pull_request' && hashFiles('.vibe-check/report.json') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('.vibe-check/report.json', 'utf8'));
            const grade = report.grade;
            const score = report.score;
            const issues = report.totalIssues;
            const checks = report.checks
              .filter(c => c.score !== null && c.score !== undefined)
              .map(c => `| ${c.name} | ${c.score}/100 | ${(c.issues||[]).length} |`)
              .join('\n');

            const body = `## vcqa ${grade} ${score}/100

            | Check | Score | Issues |
            |-------|-------|--------|
            ${checks}

            **${issues} total issues**`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## vcqa'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Check quality gate
        if: always()
        run: |
          if [ -f .vibe-check/report.json ]; then
            SCORE=$(python3 -c "import json; print(json.load(open('.vibe-check/report.json'))['score'])")
            echo "Quality score: $SCORE/100"
            if [ "$SCORE" -lt 40 ]; then
              echo "::error::Quality score $SCORE is below minimum threshold (40)"
              exit 1
            fi
          fi
