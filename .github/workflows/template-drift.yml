# Drift check for the template-game-* repos (#494). Their deploy.yml must be
# exactly GAME_DEPLOY_WORKFLOW, and no template may keep the update-deps cron
# (#452) or read an R2 secret (#488). Red here means: run
# `node scripts/sync-game-templates.mjs --apply` after building compliance.
# Reads the public template repos with the job's token; no secret.
name: Template drift

on:
  push:
    branches: [main]
    paths:
      - packages/compliance/src/game-deploy-workflow.ts
      - scripts/sync-game-templates.mjs
      - .github/workflows/template-drift.yml
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-drift
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @freegamestore/compliance build
      - run: node scripts/sync-game-templates.mjs
        env:
          GH_TOKEN: ${{ github.token }}
