name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/admin/web install --frozen-lockfile --ignore-workspace
      - run: pnpm -r build
      - run: pnpm lint
      - run: pnpm -r typecheck
      # Gate on the package test suites (compliance + cli). Previously absent,
      # which let the compliance suite sit red unnoticed after checks were
      # accidentally unwired from runChecksOn.
      - run: pnpm -r test
      - run: node --test scripts/*.test.mjs
      # Platform UI styling ratchet (ADR-001, platform#396): fails if runtime CSS
      # injection or static inline styles rise above scripts/ui-lint-baseline.json.
      - run: node scripts/lint-platform-ui.mjs
