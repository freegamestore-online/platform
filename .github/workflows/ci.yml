name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: npm install --prefix apps/admin/web
      - run: pnpm -r build
      - run: pnpm lint
      - run: pnpm -r typecheck
      # Gate on the package test suites (compliance + cli). Previously absent,
      # which let the compliance suite sit red unnoticed after checks were
      # accidentally unwired from runChecksOn.
      - run: pnpm -r test
      - run: node --test scripts/*.test.mjs
      # Platform UI styling ratchet (ADR-001, platform#396): fails if runtime CSS
      # injection or static inline styles rise above scripts/ui-lint-baseline.json.
      - run: node scripts/lint-platform-ui.mjs
