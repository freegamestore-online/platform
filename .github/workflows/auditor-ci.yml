name: Auditor CI

on:
  push:
    branches: [main]
    paths:
      - jobs/auditor/**
      - .github/workflows/auditor-ci.yml
  pull_request:
    paths:
      - jobs/auditor/**
      - .github/workflows/auditor-ci.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobs/auditor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: jobs/auditor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
