name: Prod smoke

# Runs every 30 minutes + on demand. Hits live endpoints to verify
# core FGS services are up and responding.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Store site
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://freegamestore.online)
          echo "freegamestore.online → $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Auth service
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://auth.freegamestore.online/me)
          echo "auth.freegamestore.online/me → $STATUS (401 expected for unauthenticated)"
          [ "$STATUS" = "401" ] || [ "$STATUS" = "200" ] || exit 1

      - name: Leaderboard stays out of service
        run: |
          # Out of service for now (#424): every route answers 410. Fail if it
          # starts serving scores again without this check being updated.
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' 'https://leaderboard.freegamestore.online/api/leaderboard/tetris?limit=5')
          echo "leaderboard/api/leaderboard/tetris → $STATUS"
          [ "$STATUS" = "410" ] || exit 1

      - name: Sample games (spot check 5)
        run: |
          # Path B host serves R2 objects with range support, so a plain GET comes
          # back 206 (Partial Content) — a success, not a failure. Accept 200 or 206.
          for game in tetris chess snake pong wordle; do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://${game}.freegamestore.online")
            echo "${game}.freegamestore.online → $STATUS"
            [ "$STATUS" = "200" ] || [ "$STATUS" = "206" ] || exit 1
          done

      - name: Agent service
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://agent.freegamestore.online)
          echo "agent.freegamestore.online → $STATUS"
          # Agent may return 404 on root but should not 5xx
          [ "$STATUS" -lt "500" ] || exit 1

      - name: Publisher
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://publish.freegamestore.online)
          echo "publish.freegamestore.online → $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      # The steps below are the unauthenticated half of the create canary that
      # used to run from freegamestore-online/public (#430). The authenticated
      # create → deploy → cleanup half needs a creator token and is not here.
      - name: Console + catalog
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://console.freegamestore.online)
          echo "console.freegamestore.online → $STATUS"
          [ "$STATUS" = "200" ] || exit 1
          # Catalog and store registry are the two public listings; both must carry a known game.
          curl -sf https://console.freegamestore.online/api/catalog | grep -q '"id":"tetris"' \
            || { echo "console /api/catalog is missing tetris"; exit 1; }
          curl -sf https://freegamestore.online/registry.json | grep -q '"id": *"tetris"' \
            || { echo "store registry.json is missing tetris"; exit 1; }
          echo "console /api/catalog and registry.json list tetris"

      - name: Agent health
        run: |
          BODY=$(curl -sf https://agent.freegamestore.online/health)
          echo "agent/health → $BODY"
          echo "$BODY" | grep -q '"ok":true' || exit 1

      - name: Auth gates (401 unauthenticated)
        run: |
          # Every creator/admin endpoint must refuse an anonymous caller. A 200
          # here means an auth check fell off; a 5xx means the worker is down.
          check() {
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X "$1" -H 'Content-Type: application/json' \
              -H 'Origin: https://console.freegamestore.online' "$2")
            echo "$1 $2 → $STATUS"
            [ "$STATUS" = "401" ] || exit 1
          }
          check GET    https://console.freegamestore.online/api/me
          check GET    'https://console.freegamestore.online/api/check-id?id=e2e-create-smoke-test'
          check POST   https://console.freegamestore.online/api/create
          check GET    https://admin.freegamestore.online/api/status
          check GET    https://admin.freegamestore.online/api/errors
          check DELETE https://admin.freegamestore.online/api/games/e2e-create-smoke-test
          check GET    https://mcp.freegamestore.online/mcp
          check GET    https://agent.freegamestore.online/sessions
          check GET    https://agent.freegamestore.online/v1/keys/status
          check GET    https://agent.freegamestore.online/session/e2e-create-smoke-test/status

  game-headers:
    # Hosted games must be served with the default-open capability headers
    # (#369): sensors, gamepad, mic, camera etc. =(self), CSP open to https:.
    # A regression here is how a creator ends up removing a working feature.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Default-open headers on sample games
        run: node scripts/check-game-headers.mjs tetris chess snake
