name: Deploy agent

on:
  push:
    branches: [main]
    paths:
      - workers/agent/**
      - contracts/error-log/**
      - .github/workflows/deploy-agent.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-agent
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/agent
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose — same fix as e759e8a on packages-ci.yml.
      # The root package.json declares packageManager "pnpm@10.30.3", and
      # pnpm/action-setup@v4 hard-errors on "Multiple versions of pnpm specified"
      # when a pin is also given, failing the job before it installs anything.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Install uses root lockfile; workers/agent deps are included in root lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: ../..
      - run: npx tsc --noEmit
      - run: pnpm test
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: |
          sleep 5
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" https://agent.freegamestore.online/health)
          if [ "$CODE" = "200" ]; then
            echo "agent reachable (HTTP $CODE)"
          else
            echo "WARNING: agent returned HTTP $CODE"
          fi
