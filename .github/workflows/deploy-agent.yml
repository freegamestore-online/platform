name: Deploy agent

on:
  push:
    branches: [main]
    paths:
      - workers/agent/**
      - contracts/error-log/**
      - contracts/registry-ownership/**
      - contracts/cross-site/**
      - contracts/handoff-delivery/**
      - .github/workflows/deploy-agent.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-agent
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` here on purpose — same fix as e759e8a on packages-ci.yml.
      # The root package.json declares packageManager "pnpm@10.30.3", and
      # pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 hard-errors on "Multiple versions of pnpm specified"
      # when a pin is also given, failing the job before it installs anything.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # Install from root using root lockfile; workers/agent is part of root workspace
      - run: pnpm install --frozen-lockfile
      # Build workspace packages so workers/agent can resolve @freegamestore/* dependencies
      - run: pnpm build
      - run: npx tsc --noEmit
        working-directory: workers/agent
      - run: pnpm test
        working-directory: workers/agent
      - run: pnpm exec wrangler deploy
        working-directory: workers/agent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: |
          sleep 5
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" https://agent.freegamestore.online/health)
          if [ "$CODE" = "200" ]; then
            echo "agent reachable (HTTP $CODE)"
          else
            echo "WARNING: agent returned HTTP $CODE"
          fi
