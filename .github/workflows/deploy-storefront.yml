name: Deploy storefront

on:
  push:
    branches: [main]
    paths:
      - sites/freegamestore/**
      - .github/workflows/deploy-storefront.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-storefront
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sites/freegamestore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The storefront has no runtime deps; the lockfile exists to pin wrangler
      # (exact devDependency) so the deploy step never runs an unpinned npx
      # package with CLOUDFLARE_API_TOKEN in its env (#468). --ignore-workspace:
      # sites/freegamestore is not a root workspace member (same as docs/).
      - name: Install storefront tooling
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Test storefront and deployment contract
        run: npm test
      - name: Build
        run: npm run build
      - name: Install SDK docs dependencies
        run: pnpm --dir docs install --frozen-lockfile --ignore-workspace
      - name: Build SDK docs into dist/docs
        run: npm --prefix docs run build
      - name: Verify combined deployment artifact
        run: node scripts/verify-dist.mjs
      - name: Verify sitemap and canonical agreement
        run: node scripts/verify-seo.mjs
      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy dist --project-name=freegamestore --branch=main --commit-hash=${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify live sitemap destinations
        run: node scripts/verify-seo.mjs --live
