name: Create canary

# Creates a throwaway game through the console and MCP paths, asserts the end
# state (registry entry, route, supported deploy.yml, first keyless deploy
# green) and deletes it (#527).
#
# Keyless (#531): no secret and no personal credential. Each job asks GitHub for
# an OIDC token (audience freegamestore-canary) and trades it at the auth worker
# for a 15-minute session that names no person and may only create and delete
# `e2e-create-*-test` games. The auth worker accepts the token only from THIS
# file on main, run by workflow_dispatch or schedule, so a change to this
# workflow is the only way to reach it, and that change is a push to main.
on:
  workflow_dispatch:
  # Daily, off-peak. Each run makes 2 games (console and mcp); the auth worker
  # allows 4 canary creates a UTC day, so one manual run a day fits beside it.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: create-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        path: [console, mcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @freegamestore/compliance build
      - name: Exchange OIDC token for a canary session
        run: node scripts/canary-session.mjs
      - name: Create, assert, clean up
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/create-canary.mjs --path ${{ matrix.path }}
