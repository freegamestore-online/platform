name: Fleet health

# Probes every game in the registry for the failure modes that have silently
# taken the catalog down (lockfile drift → no deploy, CI red, down, registry
# drift). Runs daily and on demand; the report lands in the job summary.
on:
  schedule:
    - cron: "0 13 * * *" # daily 13:00 UTC
  workflow_dispatch:

# Read-only probe: it checks out this repo and queries the fleet, never writing.
# Pin the ambient GITHUB_TOKEN to least privilege instead of the default read-write.
permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      FGS_STORE_REPO: platform
      FGS_REGISTRY_PATH: sites/freegamestore/registry.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Probe fleet
        env:
          # The registry lives in this repo and every game repo is public, so the
          # ambient token can read all of it (#117). An org-scoped
          # FLEET_HEALTH_GH_TOKEN, if ever set, still wins (only needed to probe a
          # private game repo).
          GH_TOKEN: ${{ secrets.FLEET_HEALTH_GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          {
            echo '## FreeGameStore fleet health'
            echo '```'
            node scripts/fleet-health.mjs
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
