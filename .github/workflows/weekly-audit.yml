name: Weekly platform audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: jobs/auditor
    steps:
      - uses: actions/checkout@v4
      - name: Checkout freegamestore registry
        uses: actions/checkout@v4
        with:
          repository: freegamestore-online/freegamestore
          path: jobs/auditor/freegamestore
      # No `version:` here on purpose — same fix as e759e8a on packages-ci.yml.
      # The root package.json declares packageManager "pnpm@10.30.3", and
      # pnpm/action-setup@v4 hard-errors on "Multiple versions of pnpm specified"
      # when a pin is also given, failing the job before it installs anything.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: jobs/auditor/pnpm-lock.yaml
      # --ignore-workspace, same fix as 9c82339 on packages-ci.yml: pnpm walks UP
      # to the root pnpm-workspace.yaml (which covers packages/* only), resolves
      # THAT workspace and silently skips jobs/auditor's own node_modules —
      # exiting 0 while leaving tsx missing. Pin the install to this unit.
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Run audit
        run: npx tsx audit.ts --all --output audit-results.json
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: jobs/auditor/audit-results.json
          retention-days: 90

  publish:
    runs-on: ubuntu-latest
    needs: audit
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Check GH_ADMIN_TOKEN
        run: |
          set -euo pipefail
          if [ -z "${GH_ADMIN_TOKEN:-}" ]; then
            echo "::error::GH_ADMIN_TOKEN secret is not set or is empty. Cannot publish audit results."
            exit 1
          fi
          echo "GH_ADMIN_TOKEN is present."
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}

      - name: Download audit results
        uses: actions/download-artifact@v4
        with:
          name: audit-results

      - name: Check audit-results.json exists
        run: |
          set -euo pipefail
          if [ ! -f audit-results.json ]; then
            echo "::error::audit-results.json not found after download. Cannot publish."
            exit 1
          fi
          echo "audit-results.json found ($(wc -c < audit-results.json) bytes)."

      - name: Publish results to store repo
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          echo "Encoding audit-results.json to base64..."
          B64=$(base64 < audit-results.json | tr -d '\n')

          echo "Fetching current file SHA (if exists)..."
          SHA=$(gh api repos/freegamestore-online/freegamestore/contents/data/quality-results.json \
            --jq '.sha' 2>/dev/null || true)

          echo "Uploading quality-results.json to freegamestore-online/freegamestore..."
          if [ -n "$SHA" ]; then
            gh api -X PUT repos/freegamestore-online/freegamestore/contents/data/quality-results.json \
              -f "message=data: weekly quality audit $(date -u +%F)" \
              -f "content=${B64}" \
              -f "sha=${SHA}"
          else
            gh api -X PUT repos/freegamestore-online/freegamestore/contents/data/quality-results.json \
              -f "message=data: weekly quality audit $(date -u +%F)" \
              -f "content=${B64}"
          fi

          echo "Publish complete."
