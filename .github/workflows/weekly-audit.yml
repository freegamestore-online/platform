name: Weekly platform audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    # Pinned to 24.04: Playwright 1.59.1 can't install chromium on the
    # ubuntu-26.04 image ubuntu-latest now uses (#402). Unpin when Playwright
    # supports 26.04.
    runs-on: ubuntu-24.04
    # 131 games at ~2.5 min each, 6 at a time, is about an hour; 90 min left no margin.
    timeout-minutes: 150
    defaults:
      run:
        working-directory: jobs/auditor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout platform monorepo for storefront audit data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: freegamestore-online/platform
          path: jobs/auditor/freegamestore
          sparse-checkout: |
            sites/freegamestore
          sparse-checkout-cone-mode: true
      # No `version:` here on purpose — same fix as e759e8a on packages-ci.yml.
      # The root package.json declares packageManager "pnpm@10.30.3", and
      # pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 hard-errors on "Multiple versions of pnpm specified"
      # when a pin is also given, failing the job before it installs anything.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: jobs/auditor/pnpm-lock.yaml
      # --ignore-workspace, same fix as 9c82339 on packages-ci.yml: pnpm walks UP
      # to the root pnpm-workspace.yaml (which covers packages/* only), resolves
      # THAT workspace and silently skips jobs/auditor's own node_modules —
      # exiting 0 while leaving tsx missing. Pin the install to this unit.
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Run audit
        run: npx tsx audit.ts --all --output audit-results.json
      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-results
          path: jobs/auditor/audit-results.json
          retention-days: 90

  publish:
    runs-on: ubuntu-latest
    needs: audit
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check GH_ADMIN_TOKEN
        run: |
          set -euo pipefail
          if [ -z "${GH_ADMIN_TOKEN:-}" ]; then
            echo "::error::GH_ADMIN_TOKEN secret is not set or is empty. Cannot publish audit results."
            exit 1
          fi
          echo "GH_ADMIN_TOKEN is present."
        env:
          GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}

      - name: Download audit results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: audit-results

      - name: Check audit-results.json exists
        run: |
          set -euo pipefail
          if [ ! -f audit-results.json ]; then
            echo "::error::audit-results.json not found after download. Cannot publish."
            exit 1
          fi
          echo "audit-results.json found ($(wc -c < audit-results.json) bytes)."

      # Streams the payload from a file (#148). Passing the base64 document as a
      # `-f content=` argument hit the kernel's argv limit ("Argument list too long").
      - name: Publish results to store repo
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: bash jobs/auditor/publish-quality-results.sh audit-results.json
