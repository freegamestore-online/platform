name = "freegamestore-publisher"
compatibility_date = "2024-12-01"
pages_build_output_dir = "web/dist"

[[kv_namespaces]]
binding = "CREATORS"
id = "b2aae28db28f4971b68d0a917b93103e"

[[kv_namespaces]]
binding = "SESSIONS"
id = "5ee61cf0158843be85e4e6e3f12bb35b"

# FGS-owned `freegamestore` D1 (same DB the admin worker binds) — the create
# Pages Function writes the durable error_log the admin console reads
# (crashes/errors surface on the panel). Split off the shared `fas` D1 on
# 2026-07-05 so FGS stands alone (see fgs-architecture-review Tier-2 #1).
[[d1_databases]]
binding = "DB"
database_name = "freegamestore"
database_id = "a122751e-11a2-466e-b403-4696f3f4a698"

# Persistent Pages Function logs — so /api/create's step + failure logs are
# queryable after the fact (the failing request had nowhere durable to log).
[observability]
enabled = true

[vars]
CF_ACCOUNT_ID = "c1089bfcc43c1c6c2aa89e584e86f0bc"
MAX_APPS_PER_USER = "10"
