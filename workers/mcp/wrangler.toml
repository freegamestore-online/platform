name = "freegamestore-mcp"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
API_BASE = "https://admin.freegamestore.online"
GITHUB_ORG = "freegamestore-online"
AGENT_BASE = "https://agent.freegamestore.online"
AUTH_BASE = "https://auth.freegamestore.online"
LEADERBOARD_BASE = "https://leaderboard.freegamestore.online"
STORE_REPO = "freegamestore"
# Set MCP_READ_ONLY = "1" to disable every write tool (create_game, update_files,
# agent_build, edit_game, admin_send_prompt, delete_game, discard_session). Reads
# and dry-runs still work; whoami reports the current state. Audit events (writes,
# dry-runs, denials) are written to OAUTH_KV with a 90-day TTL and secrets redacted.
# MCP_READ_ONLY = "1"

[observability]
enabled = true

[[routes]]
pattern = "mcp.freegamestore.online/*"
zone_name = "freegamestore.online"

# Secrets (set via `wrangler secret put`):
#   GITHUB_TOKEN          — org-level PAT for repo read/write

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "c649c4239dbd4250bc1e6507cfb8be14"

# Verify fgs_token signatures during the OAuth callback (service binding avoids
# the same-zone public-hostname loopback that returns CF 522).
[[services]]
binding = "AUTH"
service = "freegamestore-auth"

[durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "FgsMcpAgent" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FgsMcpAgent"]
