name = "freegamestore-admin"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = false

[vars]
CF_ACCOUNT_ID = "c1089bfcc43c1c6c2aa89e584e86f0bc"

[[routes]]
pattern = "admin.freegamestore.online/*"
zone_name = "freegamestore.online"

# Path B: publish writes a D1 routes row to the shared `fas` D1. The fgs/host
# worker (same DB binding) reads it + serves from the fgs-games R2 bucket
# at games/<slug>/. Replaces the previous CF Pages provisioning that capped
# the free side at 100 games per CF account.
[[d1_databases]]
binding = "DB"
database_name = "fas"
database_id = "a32701c0-5a56-4a12-810d-485166202e39"

# Secrets (set via `wrangler secret put`):
#   GITHUB_TOKEN          repo create + collaborator + registry write
#   CF_API_TOKEN          (kept for future CF API calls; not used by publish)
#   SESSION_SIGNING_KEY   shared with FAS auth flow (HS256 Bearer check)
