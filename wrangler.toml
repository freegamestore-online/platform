name = "freegamestore-host"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = false

# Emit invocation logs to Workers Logs so host failures (D1/R2 blips → 503,
# unexpected exceptions) are visible without redeploying with extra logging.
[observability]
enabled = true

# Catches every subdomain under freegamestore.online. The wildcard DNS
# record + wildcard SSL cert on the zone makes Path B scale to thousands
# of games without per-game DNS / CF Pages provisioning.
[[routes]]
pattern = "*.freegamestore.online/*"
zone_name = "freegamestore.online"

# Apex (freegamestore.online) stays on the storefront's CF Pages project
# — this worker only catches subdomains.

[[r2_buckets]]
binding = "APPS"
bucket_name = "fgs-games"

# Shares the `fas` D1 with the FAS host worker. The routes table has a
# `zone` column for exactly this: one table, many zones, one query.
# Admin already writes FGS rows here (`zone = 'freegamestore.online'`)
# via insertHostRoute() in fas/admin/src/publish.ts. If FGS later gets
# its own admin worker (per admin-worker-per-store), the routes table
# moves with admin and this binding switches to fgs D1.
[[d1_databases]]
binding = "DB"
database_name = "fas"
database_id = "a32701c0-5a56-4a12-810d-485166202e39"
