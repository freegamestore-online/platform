name = "freegamestore-agent"
main = "src/index.ts"
compatibility_date = "2025-05-01"
workers_dev = true

[[routes]]
pattern = "agent.freegamestore.online/*"
zone_name = "freegamestore.online"

[durable_objects]
bindings = [
  { name = "SESSION", class_name = "AgentSession" }
]

# Shared with auth + leaderboard. Holds the per-user `agent_sessions` index
# (session metadata only; conversation state stays in the Durable Object).
[[d1_databases]]
binding = "DB"
database_name = "leaderboard"
database_id = "165c4cb7-d93e-4afc-8ac0-7d48e627efaa"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentSession"]

[vars]
CF_ACCOUNT_ID = "c1089bfcc43c1c6c2aa89e584e86f0bc"
STORE = "games"
VAPID_PUBLIC_KEY = "BB9nIKmrVFJQJWZ4MiXzv3eN2UfGtuXESqVlQMobPiZiTmS8cQuldiXNreIV03dCo3Jkkflk6UDoAzWMvhNXCuw"

# Secrets (set via `wrangler secret put`):
# GITHUB_TOKEN       — org-level PAT for provisioning + pushing code
# CF_API_TOKEN       — Cloudflare API token for Pages/DNS
# CF_GLOBAL_KEY      — Cloudflare Global API key (for DNS)
# CF_EMAIL           — Cloudflare account email (for DNS)
